# Petiverse "Yakındakiler" dünya geneli mekân karoları (OpenStreetMap, ODbL), ayda bir yenilenir.
# Üretici: tools/petiverse-places.mjs → petiverse-places/v1/*.json (GitHub Pages'ten sunulur).
name: petiverse-places

on:
  schedule:
    - cron: '17 3 2 * *' # her ayın 2'si, 03:17 UTC (Overpass'ın sakin saati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: petiverse-places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/petiverse-places.mjs
      - name: Commit if changed
        run: |
          git add petiverse-places
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "petiverse-places: aylık OSM güncellemesi"
          git pull --rebase origin main
          git push origin HEAD:main

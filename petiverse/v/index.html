<title>Petiverse</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; margin: 0; min-height: 100vh;
         display: flex; justify-content: center; background: #F4F5F7; color: #17181C; }
  @media (prefers-color-scheme: dark) { body { background: #121318; color: #F2F3F5; } }
  .card { padding: 32px 22px 40px; max-width: 460px; width: 100%; box-sizing: border-box; }
  .kind { font-size: 14px; font-weight: 800; color: #0B7C68; margin: 0; }
  .sos .kind { color: #C62A1A; }
  @media (prefers-color-scheme: dark) { .kind { color: #57C9A0; } .sos .kind { color: #FF8A7A; } }
  h1 { font-size: 32px; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .facts { font-weight: 700; color: #3A3F4A; margin: 0 0 14px; overflow-wrap: anywhere; }
  @media (prefers-color-scheme: dark) { .facts { color: #C9CCD3; } }
  .box { background: #fff; border: 1px solid #E3E5EA; border-radius: 16px; padding: 4px 16px; margin-top: 12px; }
  @media (prefers-color-scheme: dark) { .box { background: #1C1E24; border-color: #2C2F37; } }
  .row { padding: 12px 0; border-top: 1px solid #E3E5EA; }
  .row:first-child { border-top: 0; }
  @media (prefers-color-scheme: dark) { .row { border-color: #2C2F37; } }
  .row b { display: block; font-size: 17px; overflow-wrap: anywhere; }
  .row span { display: block; color: #6A6F7A; margin-top: 2px; }
  h2 { font-size: 13px; font-weight: 800; color: #6A6F7A; margin: 18px 4px 0; }
  .text { font-size: 17px; line-height: 1.45; padding: 12px 0; overflow-wrap: anywhere; white-space: pre-line; }
  .note { font-size: 13.5px; line-height: 1.45; color: #6A6F7A; margin: 16px 4px 0; }
  a.call { display: block; margin-top: 18px; background: #C62A1A; color: #fff; text-decoration: none; text-align: center;
           padding: 16px; border-radius: 16px; font-size: 20px; font-weight: 700; }
  [hidden] { display: none !important; }
  .foot { margin-top: 26px; font-size: 12px; color: #9AA0AC; text-align: center; }
  .foot a { color: inherit; }
</style>
</head>

  const emergency = /\/e\/?$/.test(location.pathname);

  /*DECODE*/function decode(frag) {
    try {
      const b64 = frag.replaceAll('-', '+').replaceAll('_', '/');
      const bin = atob(b64.padEnd(b64.length + ((4 - (b64.length % 4)) % 4), '='));
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
    } catch { return null; }
  }/*END*/
  const day = (v) => {
    const m = /^(\d{2})(\d{2})(\d{2})$/.exec(v || '');

    }
    if (data.c) facts.push(s.chip + ': ⁦' + data.c + '⁩');
    document.getElementById('facts').textContent = facts.join(' · ');
    if (Array.isArray(data.v) && data.v.length) {
      const box = el('div');
      for (const [code, given, until] of data.v) {
        const r = el('div', 'row');
        const names = s.vaccines[code];
        r.append(el('b', '', Array.isArray(names) ? names[data.s === 'dog' ? 1 : 0] : names || String(code)));
        r.append(el('span', '', s.given.replace('{date}', day(given))));
        if (until) r.append(el('span', '', s.until.replace('{date}', day(until))));
        box.append(r);
      }
      section(s.title, box);
    }
    if (data.a) section(s.allergies, el('div', 'text', data.a));
    if (data.d) section(s.conditions, el('div', 'text', data.d));
    if (Array.isArray(data.m) && data.m.length) {
      const box = el('div');
      for (const [name, dose] of data.m) {
        const r = el('div', 'row');
        r.append(el('b', '', name));
        if (dose) r.append(el('span', '', dose));
        box.append(r);
      }
      section(s.meds, box);
    }
    if (data.p) {
      const call = document.getElementById('call');
      // Numara sağdan sola sayfada ters dönmesin: soldan sağa yalıtılır (LRI … PDI).
      call.textContent = '📞 ⁦' + data.p + '⁩';
      call.setAttribute('aria-label', s.call + ' ' + data.p);
      call.href = 'tel:' + String(data.p).replace(/[^+\d]/g, '');
      call.hidden = false;
    }
    document.getElementById('note').textContent = s.disclaimer;
    document.getElementById('created').textContent = s.created.replace('{date}', day(data.g));
  } else {
    document.title = kind;
    document.getElementById('name').textContent = s.unread;
    document.getElementById('note').textContent = s.unreadBody;
  }
</script>
</body>
</html>

  function pickLang() {
    for (const l of navigator.languages || [navigator.language || 'en']) {
      const low = l.toLowerCase();
      if (low.startsWith('zh')) { const k = /hant|tw|hk|mo/.test(low) ? 'zh-Hant' : 'zh-Hans'; if (T[k]) return k; continue; }
      if (low.startsWith('no') || low.startsWith('nn')) { if (T.nb) return 'nb'; continue; }
      const k = low.split('-')[0];
      if (T[k]) return k;
    }
    return 'en';
  }
  const lang = pickLang();
  const s = T[lang] || T.en;
  document.documentElement.lang = lang;
  if (lang === 'ar' || lang === 'he') document.documentElement.dir = 'rtl';
  document.getElementById('foot').textContent = s.foot;
  document.getElementById('home').href = 'https://moonarcworks.com/petiverse/' + (lang === 'en' ? '' : lang + '/');
  function decode(frag) {
    try {
      const b64 = frag.replaceAll('-', '+').replaceAll('_', '/');
      const bin = atob(b64.padEnd(b64.length + ((4 - (b64.length % 4)) % 4), '='));
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
    } catch { return null; }
  }
  const data = decode(location.hash.slice(1));
  if (data && data.n && data.p) {
    document.getElementById('emoji').textContent = data.s === 'dog' ? '🐶' : data.s === 'cat' ? '🐱' : '🐾';
    document.getElementById('name').textContent = data.n;
    document.getElementById('hello').textContent = s.hello;
    // Künyede varsa: cinsiyet, yaş (doğum ayından), çip, görünüşü ve huyu.
    const facts = [];
    if (data.x === 'f' || data.x === 'm') facts.push(data.x === 'f' ? '♀' : '♂');
    const born = /^(\d{4})-(\d{2})$/.exec(data.y || '');
    if (born) {
      const now = new Date();
      const months = (now.getFullYear() - Number(born[1])) * 12 + now.getMonth() + 1 - Number(born[2]);
      if (months >= 0) {
        const unit = months < 12 ? 'month' : 'year';
        try { facts.push(new Intl.NumberFormat(lang, { style: 'unit', unit, unitDisplay: 'long' }).format(months < 12 ? months : Math.floor(months / 12))); } catch {}
      }
    }
    if (data.k && s.chip) facts.push(s.chip);
    if (facts.length) { const el = document.getElementById('facts'); el.textContent = facts.join(' · '); el.hidden = false; }
    if (data.l) { const el = document.getElementById('looks'); el.textContent = data.l; el.hidden = false; }
    if (data.m) document.getElementById('note').textContent = '⚠️ ' + data.m;
    const call = document.getElementById('call');
    // Numara sağdan sola sayfada ters dönmesin: soldan sağa yalıtılır (LRI … PDI).
    call.textContent = '📞 \u2066' + data.p + '\u2069';
    call.setAttribute('aria-label', s.call + ' ' + data.p);
    call.href = 'tel:' + String(data.p).replace(/[^+\d]/g, '');
    call.hidden = false;
    document.title = data.n + ' – Petiverse';
  } else {
    document.title = s.title;
    document.getElementById('name').textContent = s.unreadTitle;
    document.getElementById('hello').textContent = s.unreadBody;
  }
